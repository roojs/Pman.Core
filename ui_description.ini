; Sparse UI hints for the AI assistant. Do not restate BJS titles/fields/tab trees.
; Section = full Pman.Dialog.* / Pman.Tab.* name from the .bjs "name" property.

[Pman.Dialog.CoreViewWebsite]
_description = "URL viewer dialog. For LLM usage always pass relative: true with a root-relative url (e.g. Admin EventView event log detail). Prefer this over fetch_data alone when the user needs the full event payload (posted log / audit), not just Events.remarks."
_args = "{ url, relative: true }"
_showExample = "show_dialog({ name: 'CoreViewWebsite', args: { url: '/Admin/EventView/2977832349.html', relative: true }, wait: false })"
url = "Required. Root-relative app path, e.g. '/Admin/EventView/{Events.id}.html'. Do not invent a host."
relative = "Always true for LLM usage. relative: false is not permitted. Always use wait: false — this dialog has no Save callback."

[Pman.Dialog.CorePersonContact]
_description = "Edit / create an external contact on core_person (company, office, name, email). Not a staff login — that is AdminPerson. On Media Outreach, CRM contacts are CrmPerson, not this dialog."
_args = "{ id: core_person id; 0 to create }"
_showExample = "show_dialog({ name: 'CorePersonContact', args: { id: 123 }, wait: true })"

[Pman.Dialog.CoreEmail]
_description = "Compose or edit stored email (core_email, or a module override). Media Outreach CRM mailouts: always pass args.module = crm_mailing_list_message (CrmMailingListMessage is unused); sending is CrmMailingListQueue. System templates from AdminEmailTemplates: pass { id: core_email id } and do not set that CRM module. Prefill name, subject, and bodytext in changes when the user gave copy. User Saves. This does not send."
_args = "{ id, module }"
_showExample = "show_dialog({ name: 'CoreEmail', args: { id: 0, module: 'crm_mailing_list_message' }, changes: { name: 'August newsletter', subject: 'News from Acme', bodytext: '<p>Hello</p>' }, wait: true })"
id = "Row id to edit. CRM mailout: crm_mailing_list_message id. System template: core_email id. 0 or omit to create."
module = "CRM mailouts: always 'crm_mailing_list_message'. System templates from AdminEmailTemplates: omit this (do not pass the CRM module)."
name = "Mailout Name (internal list title, not the subject). Prefill in changes when the user named the campaign."
subject = "Email subject line — prefill in changes when known"
bodytext = "HTML body. Prefill in changes when the user dictated or pasted copy. Leave for the user / Stripo import when they asked to design the layout."
plaintext = "Plain-text alternative. Leave unless converting HTML; Stripo import fills this."
from_name = "From display name. Defaults to the logged-in user on create — leave unless the user specified a sender."
from_email = "From address (hidden). Defaults to the logged-in user on create."
/message = "From, subject, HTML/plain body"
/images-attachments = "Images and file attachments for this message"
