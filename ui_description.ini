; Sparse UI hints for the AI assistant. Do not restate BJS titles/fields/tab trees.
; Section = full Pman.Dialog.* / Pman.Tab.* name from the .bjs "name" property.

[Pman.Dialog.CoreViewWebsite]
_description = "URL viewer dialog. For LLM usage always pass relative: true with a root-relative url (e.g. Admin EventView event log detail). Prefer this over fetch_data alone when the user needs the full event payload (posted log / audit), not just Events.remarks."
_args = "{ url, relative: true }"
_showExample = "show_dialog({ name: 'CoreViewWebsite', args: { url: '/Admin/EventView/2977832349.html', relative: true }, wait: false })"
url = "Required. Root-relative app path, e.g. '/Admin/EventView/{Events.id}.html'. Do not invent a host."
relative = "Always true for LLM usage. relative: false is not permitted. Always use wait: false — this dialog has no Save callback."
